version: '3.7'
services:
  laravel-echo-server:
    build:
      context: .
      dockerfile: Dockerfile.echo
    container_name: laravel-echo-server
    restart: unless-stopped
    ports:
      - "6001:6001"
    volumes:
      - ./laravel-echo-server.json:/app/laravel-echo-server.json:ro
    environment:
      - NODE_ENV=production
