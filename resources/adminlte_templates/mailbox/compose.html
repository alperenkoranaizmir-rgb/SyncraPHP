{% extends 'resources/adminlte_templates/base.html' %}
{% block content %}
  <div class="card">
    <div class="card-header"><h3 class="card-title">Compose Mail</h3></div>
    <div class="card-body">
      <form>
        <div class="form-group"><input class="form-control" placeholder="To:"></div>
        <div class="form-group"><input class="form-control" placeholder="Subject:"></div>
        <div class="form-group"><div class="summernote">Message body</div></div>
        <button class="btn btn-primary">Send</button>
      </form>
    </div>
  </div>
{% endblock %}
