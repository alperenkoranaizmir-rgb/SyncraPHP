{% extends 'resources/adminlte_templates/base.html' %}
{% block content %}
  <div class="card">
    <div class="card-header"><h3 class="card-title">General Forms</h3></div>
    <div class="card-body">
      <form>
        <div class="form-group">
          <label>Text</label>
          <input class="form-control" placeholder="Enter ...">
        </div>
        <div class="form-group">
          <label>Textarea</label>
          <textarea class="form-control" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>Checkbox</label>
          <div class="form-check"><input class="form-check-input" type="checkbox"> <label class="form-check-label">Check me</label></div>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
