<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link rel="stylesheet" href="/vendor/adminlte/dist/css/adminlte.min.css">
  </head>
  <body class="hold-transition register-page">
    <div class="register-box">
      <div class="register-logo"><a href="#"><b>Syncra</b></a></div>
      <div class="card">
        <div class="card-body register-card-body">
          <p class="login-box-msg">Register a new membership</p>
          <form>
            <div class="input-group mb-3"><input class="form-control" placeholder="Full name"></div>
            <div class="input-group mb-3"><input class="form-control" placeholder="Email"></div>
            <div class="input-group mb-3"><input class="form-control" placeholder="Password"></div>
            <div class="row"><div class="col-8"><a href="#" class="text-center">I already have a membership</a></div><div class="col-4"><button class="btn btn-primary btn-block">Register</button></div></div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
